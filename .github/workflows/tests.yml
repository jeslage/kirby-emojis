name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: mbstring, intl, curl, gd
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  js:
    runs-on: ubuntu-latest
    name: JS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # The built Panel bundle is committed (Composer installs use it as is)
      - name: Check that index.js and index.css are up to date
        run: git diff --exit-code -- index.js index.css
